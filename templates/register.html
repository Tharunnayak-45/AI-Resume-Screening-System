<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | AI Resume Screening System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at 10% 20%, rgba(0, 238, 255, 0.13), transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(124, 58, 237, 0.18), transparent 32%),
                linear-gradient(135deg, #020617, #07152e, #030712);
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }

        /* =========================
           ANIMATED BACKGROUND
        ========================= */

        body::before {
            content: "";
            position: fixed;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: rgba(0, 229, 255, 0.13);
            filter: blur(100px);
            top: -150px;
            left: -120px;
            animation: floatOne 8s ease-in-out infinite;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.15);
            filter: blur(110px);
            bottom: -180px;
            right: -120px;
            animation: floatTwo 10s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes floatOne {

            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(80px, 60px);
            }
        }

        @keyframes floatTwo {

            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-70px, -60px);
            }
        }


        /* =========================
           BACKGROUND GRID
        ========================= */

        .grid-background {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 45px 45px;
            mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
            pointer-events: none;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .register-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 15px;
            position: relative;
            z-index: 2;
        }


        /* =========================
           REGISTER CARD
        ========================= */

        .register-card {
            width: 100%;
            max-width: 470px;
            padding: 2px;
            border-radius: 26px;

            background:
                linear-gradient(
                    135deg,
                    rgba(0, 238, 255, 0.75),
                    rgba(255,255,255,0.08),
                    rgba(139,92,246,0.75)
                );

            box-shadow:
                0 0 30px rgba(0, 238, 255, 0.12),
                0 0 70px rgba(124, 58, 237, 0.10);

            animation: cardAppear 0.8s ease;
        }

        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        .register-inner {
            background:
                linear-gradient(
                    145deg,
                    rgba(8, 20, 42, 0.96),
                    rgba(3, 10, 25, 0.97)
                );

            border-radius: 24px;
            padding: 35px 38px;
            backdrop-filter: blur(25px);
        }


        /* =========================
           AI LOGO
        ========================= */

        .ai-logo {
            width: 62px;
            height: 62px;
            margin: 0 auto 18px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #00e5ff,
                    #2563eb,
                    #8b5cf6
                );

            box-shadow:
                0 0 20px rgba(0,229,255,0.5),
                0 0 40px rgba(139,92,246,0.25);

            animation: logoGlow 3s ease-in-out infinite;
        }

        .ai-logo i {
            font-size: 31px;
            color: white;
        }

        @keyframes logoGlow {

            0%, 100% {
                box-shadow:
                    0 0 20px rgba(0,229,255,0.45),
                    0 0 40px rgba(139,92,246,0.20);
            }

            50% {
                box-shadow:
                    0 0 30px rgba(0,229,255,0.70),
                    0 0 60px rgba(139,92,246,0.35);
            }
        }


        /* =========================
           HEADER
        ========================= */

        .register-title {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 7px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #67e8f9,
                #a78bfa
            );

            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .register-subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }


        /* =========================
           FORM LABEL
        ========================= */

        .form-label {
            color: #dbeafe;
            font-size: 14px;
            margin-bottom: 8px;
        }


        /* =========================
           INPUT GROUP
        ========================= */

        .input-group {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;

            color: #38bdf8;
            font-size: 17px;

            transition: 0.3s;
        }


        /* =========================
           INPUTS
        ========================= */

        .form-control,
        .form-select {

            min-height: 52px;

            background: rgba(15, 23, 42, 0.78) !important;

            border: 1px solid rgba(148, 163, 184, 0.20) !important;

            color: #f8fafc !important;

            border-radius: 13px !important;

            padding-left: 46px;

            font-size: 14px;

            transition: all 0.3s ease;

            box-shadow: inset 0 0 15px rgba(0,0,0,0.12);
        }


        .form-select {
            padding-left: 46px;
        }


        .form-control::placeholder {
            color: #64748b;
        }


        .form-control:focus,
        .form-select:focus {

            border-color: #22d3ee !important;

            box-shadow:
                0 0 0 3px rgba(34,211,238,0.08),
                0 0 18px rgba(34,211,238,0.20),
                inset 0 0 12px rgba(34,211,238,0.04) !important;

            background: rgba(8, 25, 48, 0.95) !important;
        }


        .form-control:focus ~ .input-icon {
            color: #67e8f9;
        }


        /* =========================
           PASSWORD BUTTON
        ========================= */

        .password-group .form-control {
            padding-right: 55px;
        }

        .password-btn {
            position: absolute;

            right: 7px;
            top: 7px;

            width: 38px;
            height: 38px;

            border: 0 !important;

            border-radius: 10px !important;

            background: rgba(34,211,238,0.07) !important;

            color: #67e8f9 !important;

            z-index: 10;

            transition: all 0.3s ease;
        }

        .password-btn:hover {

            background: rgba(34,211,238,0.17) !important;

            color: #ffffff !important;

            box-shadow:
                0 0 15px rgba(34,211,238,0.25);
        }


        /* =========================
           ROLE SELECT
        ========================= */

        .form-select {
            cursor: pointer;
        }

        .form-select option {
            background: #07152e;
            color: white;
        }


        /* =========================
           FLASH MESSAGE
        ========================= */

        .alert {

            background: rgba(14, 165, 233, 0.10) !important;

            color: #bae6fd !important;

            border: 1px solid rgba(14,165,233,0.30) !important;

            border-radius: 12px;

            font-size: 13px;

            box-shadow:
                0 0 18px rgba(14,165,233,0.08);
        }


        /* =========================
           CREATE ACCOUNT BUTTON
        ========================= */

        .create-btn {

            position: relative;

            width: 100%;
            min-height: 54px;

            border: none;

            border-radius: 14px;

            font-size: 15px;
            font-weight: 700;

            color: white;

            background:
                linear-gradient(
                    90deg,
                    #06b6d4,
                    #2563eb,
                    #7c3aed
                );

            background-size: 200% 100%;

            box-shadow:
                0 0 20px rgba(6,182,212,0.20),
                0 0 35px rgba(124,58,237,0.15);

            transition: all 0.4s ease;

            overflow: hidden;
        }


        .create-btn::before {

            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 100%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.25),
                    transparent
                );

            transition: 0.6s;
        }


        .create-btn:hover {

            background-position: 100% 0;

            transform: translateY(-2px);

            box-shadow:
                0 0 25px rgba(6,182,212,0.45),
                0 0 50px rgba(124,58,237,0.30);
        }


        .create-btn:hover::before {
            left: 100%;
        }


        .create-btn:active {
            transform: scale(0.98);
        }


        /* =========================
           LOGIN LINK
        ========================= */

        .login-section {

            text-align: center;

            margin-top: 25px;

            font-size: 13px;

            color: #64748b;
        }


        .login-link {

            color: #67e8f9;

            text-decoration: none;

            font-weight: 700;

            margin-left: 4px;

            transition: 0.3s;
        }


        .login-link:hover {

            color: #ffffff;

            text-shadow:
                0 0 10px rgba(103,232,249,0.7);
        }


        /* =========================
           SECURITY TEXT
        ========================= */

        .security-text {

            text-align: center;

            margin-top: 20px;

            font-size: 11px;

            color: #475569;
        }

        .security-text i {
            color: #22c55e;
            margin-right: 4px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 576px) {

            .register-container {
                padding: 20px 12px;
            }

            .register-inner {
                padding: 30px 22px;
            }

            .register-title {
                font-size: 25px;
            }

            .ai-logo {
                width: 56px;
                height: 56px;
            }
        }

    </style>

</head>


<body>

    <!-- Background Grid -->
    <div class="grid-background"></div>


    <!-- Main Container -->
    <div class="register-container">


        <!-- Register Card -->
        <div class="register-card">

            <div class="register-inner">


                <!-- AI Logo -->
                <div class="ai-logo">

                    <i class="bi bi-person-plus-fill"></i>

                </div>


                <!-- Header -->
                <h1 class="register-title">
                    Create An Account
                </h1>

                <p class="register-subtitle">
                    Join the AI-powered resume screening platform
                </p>


                <!-- Flash Messages -->
                {% with messages = get_flashed_messages() %}

                    {% if messages %}

                        {% for message in messages %}

                            <div class="alert alert-info mb-4" role="alert">

                                <i class="bi bi-info-circle me-2"></i>

                                {{ message }}

                            </div>

                        {% endfor %}

                    {% endif %}

                {% endwith %}


                <!-- Register Form -->
                <form method="POST" action="{{ url_for('register') }}">


                    <!-- Full Name -->
                    <div class="mb-3">

                        <label for="full_name" class="form-label fw-semibold">

                            Full Name

                        </label>

                        <div class="input-group">

                            <i class="bi bi-person input-icon"></i>

                            <input
                                type="text"
                                class="form-control"
                                id="full_name"
                                name="full_name"
                                placeholder="Enter your full name"
                                autocomplete="name"
                                required>

                        </div>

                    </div>


                    <!-- Email -->
                    <div class="mb-3">

                        <label for="email" class="form-label fw-semibold">

                            Email Address

                        </label>

                        <div class="input-group">

                            <i class="bi bi-envelope input-icon"></i>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required>

                        </div>

                    </div>


                    <!-- Password -->
                    <div class="mb-3">

                        <label for="password" class="form-label fw-semibold">

                            Password

                        </label>

                        <div class="input-group password-group">

                            <i class="bi bi-lock input-icon"></i>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                placeholder="Create a password"
                                autocomplete="new-password"
                                minlength="6"
                                required>

                            <button
                                type="button"
                                class="password-btn"
                                onclick="togglePassword('password', 'passwordIcon')">

                                <i class="bi bi-eye" id="passwordIcon"></i>

                            </button>

                        </div>

                    </div>


                    <!-- Confirm Password -->
                    <div class="mb-3">

                        <label for="confirm_password" class="form-label fw-semibold">

                            Confirm Password

                        </label>

                        <div class="input-group password-group">

                            <i class="bi bi-shield-lock input-icon"></i>

                            <input
                                type="password"
                                class="form-control"
                                id="confirm_password"
                                name="confirm_password"
                                placeholder="Confirm your password"
                                autocomplete="new-password"
                                minlength="6"
                                required>

                            <button
                                type="button"
                                class="password-btn"
                                onclick="togglePassword('confirm_password', 'confirmPasswordIcon')">

                                <i class="bi bi-eye" id="confirmPasswordIcon"></i>

                            </button>

                        </div>

                        <!-- Password Match -->
                        <small id="passwordMessage"
                            style="display:none; margin-top:7px;">
                        </small>

                    </div>


                    <!-- Account Type -->
                    <div class="mb-4">

                        <label for="role" class="form-label fw-semibold">

                            Account Type

                        </label>

                        <div class="input-group">

                            <i class="bi bi-person-badge input-icon"></i>

                            <select
                                class="form-select"
                                id="role"
                                name="role"
                                required>

                                <option value="Candidate">
                                    Candidate
                                </option>

                                <option value="Recruiter">
                                    Recruiter
                                </option>

                            </select>

                        </div>

                    </div>


                    <!-- Create Account -->
                    <div class="d-grid">

                        <button
                            type="submit"
                            class="create-btn">

                            <i class="bi bi-person-plus me-2"></i>

                            Create Account

                        </button>

                    </div>


                </form>


                <!-- Login -->
                <div class="login-section">

                    Already have an account?

                    <a
                        href="{{ url_for('login') }}"
                        class="login-link">

                        Login

                    </a>

                </div>


                <!-- Security -->
                <div class="security-text">

                    <i class="bi bi-shield-check"></i>

                    Your account information is securely protected

                </div>


            </div>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        /* Password Show / Hide */

        function togglePassword(inputId, iconId) {

            const input =
                document.getElementById(inputId);

            const icon =
                document.getElementById(iconId);


            if (input.type === "password") {

                input.type = "text";

                icon.classList.remove("bi-eye");

                icon.classList.add("bi-eye-slash");

            }

            else {

                input.type = "password";

                icon.classList.remove("bi-eye-slash");

                icon.classList.add("bi-eye");

            }

        }


        /* Password Match Checker */

        const password =
            document.getElementById("password");

        const confirmPassword =
            document.getElementById("confirm_password");

        const passwordMessage =
            document.getElementById("passwordMessage");


        function checkPassword() {

            if (confirmPassword.value === "") {

                passwordMessage.style.display = "none";

                return;

            }


            passwordMessage.style.display = "block";


            if (password.value === confirmPassword.value) {

                passwordMessage.innerHTML =
                    '<i class="bi bi-check-circle"></i> Passwords match';

                passwordMessage.style.color = "#22c55e";

            }

            else {

                passwordMessage.innerHTML =
                    '<i class="bi bi-x-circle"></i> Passwords do not match';

                passwordMessage.style.color = "#fb7185";

            }

        }


        password.addEventListener(
            "input",
            checkPassword
        );

        confirmPassword.addEventListener(
            "input",
            checkPassword
        );

    </script>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
